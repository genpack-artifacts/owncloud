# mod_php ではなく php-fpm に .php を渡す(50-php.sh がプールを設定する)。
# mod_php を使わないので eselect-php の 70_mod_php.conf は入らず、
# APACHE2_OPTS の -D PHP も付かない。proxy / proxy_fcgi は -D PROXY で有効になる。
<IfModule proxy_fcgi_module>
	# WebDAV クライアントの Basic 認証で必要
	SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

	<FilesMatch "\.(php|phar)$">
		SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
	</FilesMatch>

	DirectoryIndex index.php
</IfModule>
